submission:
  title: "Fab Bottleneck & Supply Chain Risk Advisor"

  problem_statement: >
    Semiconductor fabs suffer cascading production losses when manufacturing
    bottlenecks and supply-chain risks coincide — yet operations teams lack a
    unified system that simultaneously detects bottlenecks, simulates outage
    impacts, and quantifies material supply vulnerability before a crisis occurs.

  solution_summary: >
    We built an intelligence and decision-support system that detects fab
    bottlenecks using deterministic engineering formulas (utilisation, WIP
    pressure, capacity pressure), simulates tool outages to calculate backlog
    and recovery time, traces downstream process impact, and assesses supply
    chain risk via HHI, SPOF detection, and inventory coverage — with IBM Bob
    providing natural-language explanation and decision briefs for every result.

  key_features:
    - "Real-time bottleneck scoring using composite Bottleneck Score (utilisation + WIP pressure + capacity pressure)"
    - "Outage simulation: calculates backlog accumulation, recovery time, and downstream process delay for any tool"
    - "Supply chain risk engine: HHI concentration index, SPOF detection, inventory coverage, and geopolitical risk assessment"
    - "Combined risk dashboard fusing manufacturing and supply-chain risk into a single actionable score with prioritised mitigation recommendations"
    - "IBM Bob AI narration layer: explains all deterministic results in natural language with full deterministic fallback when Bob is unavailable"

  tech_stack:
    languages: ["Python", "TypeScript"]
    frameworks: ["FastAPI", "React", "Vite", "Tailwind CSS", "Recharts", "Pydantic", "NumPy", "Pandas"]
    ibm_technologies: ["IBM Bob", "watsonx.ai", "IBM Granite 13B Instruct"]
    databases: ["PostgreSQL", "Supabase-compatible SQL"]
    other: ["asyncpg", "uvicorn", "httpx", "pytest"]

  what_we_are_most_proud_of: >
    The complete deterministic calculation pipeline — WIP pressure, HHI, SPOF
    detection, outage simulation with impossible-recovery detection, and combined
    risk scoring — all implemented without any ML models, using pure engineering
    formulas that can be validated against domain knowledge. IBM Bob is load-bearing:
    it provides context-aware natural-language decision briefs for every risk
    dimension, with a robust fallback so the application remains fully functional
    if Bob is unavailable. The entire flow from bottleneck detection to mitigation
    recommendation to Bob explanation mirrors the real industrial decision workflow.

  known_limitations: >
    All data is synthetic/demo — fab tool parameters, supplier shares, and
    geopolitical risk entries are fabricated for demonstration. The geopolitical
    risk module uses static scenario data rather than a live feed. The frontend
    assumes a single active shift and does not yet support multi-shift scheduling
    optimisation. Bob narration quality depends on watsonx.ai API availability
    and model version; the fallback templates are informative but less specific
    than live Bob responses.

